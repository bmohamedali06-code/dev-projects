<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
</head>
<body style="padding: 50px">
    <header>
        <h1><i>Acme Support</i></h1>
        <nav>
            <a href="home.index">Home</a>
            <a href="Help.index" style="margin-left: 30px;">Help</a>
            <a href="Contact.index" style="margin-left: 30px">Contact</a>
        </nav>
    </header>
        <hr style="height: 2px; background-color: black; border: none;">
    <main>
        <h1><i>Contact us</i></h1>
        <p>Send us a message and we will get back to you</p>
        <form action="/submit-form-placehorder" method="post">
            <table border="0" cellpadding="10" cellspacing="0">
                <tr>
                    <td>
                        <label for="full-name"><i><strong>Full name</strong></i></label>
                    </td>
                    <td width="300">
                        <input type="text" id="full-name" name="full-name" style="width: 97%;" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="email"><i><strong>Email</strong></i></label>
                    </td>
                    <td>
                        <input type="email" id="email" name="email" style="width: 97%;" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="subject"><i><strong>Subject</strong></i></label>
                    </td>
                    <td>
                        <select id="subject" name="subject" style="width: 100%; box-sizing: border-box;" required>
                            <option value="" disabled selected>Choose a topic</option>
                            <option value="general">General informations</option>
                            <option value="support">Technical Support</option>
                        </select>
                    </td>
                </tr>
                <t>
                    <td>
                        <label for="message"><i><strong>Message</strong></i></label>
                    </td>
                    <td>
                        <textarea id="message" name="message" rows="5" style="width: 100%; box-sizing: border-box;" minlength="10" required></textarea>
                    </td>
                </tr>
            </table>
            <fieldset style="border: none">
                <legend><strong>How did you hear about us</strong></legend>
                <input type="radio" id="search" name="choice" value="search">
                <label for="search">Search</label><br>
                <input type="radio" id="friend" name="choice" value="friend">
                <label for="friend">Friend</label><br>
                <input type="radio" id="social-media" name="choice" value="social-media">
                <label for="social-media">Social media</label><br>
            </fieldset>
            <p>
                <input type="checkbox" id="updates" name="update" value="yes">
                <label for="updates"><i>Send me product updates</i></label>
            </p>
            <p>
                <button type="button" style="padding: 10px 30px; font-size: 15px" onclick="alert('Form subvmitted successfully');"><i>Send message</i></button>
        </form>
    </main>
    <footer>
    <p>
        <p>&copy; 2026 Acme Support</p>
  </footer>
</body>
</html>
